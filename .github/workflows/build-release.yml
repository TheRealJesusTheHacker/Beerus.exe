name: build-release

# Builds Beerus Portable when a release is published:
#   * checks the release tag against beerus.__version__ (a vX.Y.Z
#     tag that disagrees with the code never ships)
#   * runs the full test suite (GUI tests run offscreen)
#   * builds the portable edition with PyInstaller — a one-folder
#     build from packaging/Beerus.spec (Beerus.exe plus its
#     runtime libraries in one folder; no install, no Python on
#     the target machine)
#   * greps the PyInstaller warn file for PySide6 — a build that
#     silently dropped the GUI toolkit fails HERE, not on a
#     user's machine
#   * smoke-tests the staged portable exe (starts it offscreen;
#     a GUI that dies on launch fails the run)
#   * zips the portable folder as BeerusPortable.zip, writes
#     SHA256SUMS.txt covering it, and attaches both to the release
#
# workflow_dispatch runs the same pipeline as a dry run (tests,
# build, smoke test, zip, checksums) but attaches nothing to any
# release — it exists so the pipeline can be verified without
# cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening,
      # the same pins the fleet's other release workflows use; SHAs
      # verified against the upstream repos with `git ls-remote` on
      # 2026-10-19): a moved tag must never change what a release
      # build runs.
      - name: Check out the release tag (or the dispatched ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the release tag matches the code version
        if: github.event_name == 'release'
        run: |
          $tag = "${{ github.ref_name }}"
          $init = Get-Content beerus/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') {
            Write-Host "Could not read __version__ from beerus/__init__.py."
            exit 1
          }
          $code = $Matches[1]
          if ("v$code" -ne $tag) {
            Write-Host "Release tag '$tag' does not match beerus.__version__ '$code' (expected tag 'v$code')."
            exit 1
          }
          # The same version lives in three places; all three
          # must agree with the tag, so a drift in any one of
          # them fails the release instead of shipping silently.
          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -notmatch 'version\s*=\s*"([^"]+)"') {
            Write-Host "Could not read version from pyproject.toml."
            exit 1
          }
          if ($Matches[1] -ne $code) {
            Write-Host "pyproject.toml version '$($Matches[1])' does not match beerus.__version__ '$code'."
            exit 1
          }
          $spec = Get-Content packaging/Beerus.spec -Raw
          if ($spec -notmatch [regex]::Escape("`"FileVersion`", `"$code.0`"")) {
            Write-Host "packaging/Beerus.spec FileVersion does not match '$code.0'."
            exit 1
          }
          Write-Host "Release tag $tag matches beerus.__version__ $code (and pyproject.toml, and the spec's version resource)."

      - name: Install dependencies
        run: pip install --require-hashes -r packaging/requirements-ci.lock.txt

      - name: Run the test suite (GUI offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build the portable edition (one-folder PyInstaller build)
        run: pyinstaller packaging/Beerus.spec --noconfirm

      - name: Check the build for missing modules (warn file)
        run: |
          $warnFiles = Get-ChildItem -Path build -Recurse -Filter "warn-*.txt"
          if (-not $warnFiles) {
            Write-Host "PyInstaller warn file not found under build - cannot verify the module watchlist."
            exit 1
          }
          $watchlist = "PySide6"
          $failed = $false
          foreach ($warn in $warnFiles) {
            # Only genuinely MISSING modules count: the gate scans
            # the warn file's "missing module named X" lines for
            # the watchlist, anchored to the exact module names,
            # so an unrelated optional sub-import of a present
            # package can never fail a healthy build.
            $hits = Select-String -Path $warn.FullName -Pattern "missing module named (PySide6)(\.|$| )"
            if ($hits) {
              Write-Host "PyInstaller could not find modules on the watchlist (in $($warn.FullName)):"
              $hits | ForEach-Object { Write-Host $_.Line }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "No watchlist modules missing from the build."

      - name: Assemble the portable edition folder
        run: |
          New-Item -ItemType Directory -Force dist\BeerusPortable | Out-Null
          Copy-Item dist\Beerus\* dist\BeerusPortable\ -Recurse
          Copy-Item packaging\portable\README-PORTABLE.txt dist\BeerusPortable\

      # Importing PySide6 in a test is not proof the packaged GUI
      # can start: the Qt platform plugin loads only when a
      # QApplication is created. Start the staged portable exe
      # offscreen — a build whose window dies on launch exits
      # before the wait is over and fails here; a healthy window
      # is still running when the wait ends and is then closed.
      - name: Smoke-test the portable exe (starts offscreen and stays up)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $proc = Start-Process -FilePath "dist\BeerusPortable\Beerus.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "Beerus.exe exited on launch with code $($proc.ExitCode) - the packaged GUI did not start."
            exit 1
          }
          Write-Host "Beerus.exe is running - the packaged GUI started."
          Stop-Process -Id $proc.Id -Force

      - name: Zip the portable edition and write SHA256SUMS.txt
        run: |
          Compress-Archive -Path dist\BeerusPortable\* -DestinationPath dist\BeerusPortable.zip -Force
          $hash = (Get-FileHash dist\BeerusPortable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BeerusPortable.zip" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Attach the portable edition and checksums to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} dist/BeerusPortable.zip dist/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
