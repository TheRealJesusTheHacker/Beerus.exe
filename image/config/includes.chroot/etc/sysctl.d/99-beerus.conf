# Beerus Live Boot — network protocol lockdown.
# The destruction environment needs no network at all and runs no
# network services (see config/package-lists/beerus.list.chroot).
# MPTCP is therefore pure attack surface: disable it in the shipped
# default (CVE-2026-98432 class; fleet lockdown 2026-10-31).
# Registered in check_definition.py's required files so this
# lockdown cannot silently drop out of the image definition.
net.mptcp.enabled = 0
