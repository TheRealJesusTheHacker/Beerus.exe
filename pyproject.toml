[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beerus"
version = "0.6.2"
description = "BEERUS.EXE — Sentinel Safeguard LLC secure drive destruction (Live Boot)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Sentinel Safeguard LLC" },
]

[tool.setuptools.packages.find]
include = ["beerus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
